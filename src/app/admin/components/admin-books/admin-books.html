<div class="admin-header">
  <h1>Správa kníh</h1>
  <a matButton="filled" routerLink="/admin/new">
    <mat-icon>add</mat-icon> Pridať knihu
  </a>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Názov</th>
      <th>Autor</th>
      <th>Rok</th>
      <th>Stav</th>
      <th>Akcie</th>
    </tr>
  </thead>
  <tbody>
    @for (book of books(); track book.id) {
      <tr>
        <td>{{ book.id }}</td>
        <td><a [routerLink]="['/books', book.id]">{{ book.title }}</a></td>
        <td>{{ book.author }}</td>
        <td>{{ book.year }}</td>
        <td>{{ book.available ? 'Dostupná' : 'Vypožičaná' }}</td>
        <td>
          @if (confirmingDeleteId() === book.id) {
            <span>Naozaj zmazať?</span>
            <button matButton (click)="cancelDelete()">Nie</button>
            <button matButton="filled" (click)="confirmDelete(book)">Áno</button>
          } @else {
            <a matIconButton [routerLink]="['/admin', book.id, 'edit']" aria-label="Upraviť" title="Upraviť">
              <mat-icon>edit</mat-icon>
            </a>
            <button matIconButton (click)="askDelete(book)" aria-label="Zmazať" title="Zmazať">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
