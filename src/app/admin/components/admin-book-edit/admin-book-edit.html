@if (!isEditMode()) {
  <h1>Nová kniha</h1>
  <app-book-form (saved)="save($event)" (cancelled)="cancel()" />
} @else if (book()) {
  <h1>Úprava knihy</h1>
  <app-book-form [book]="book()!" (saved)="save($event)" (cancelled)="cancel()" />
} @else {
  <p>Kniha s číslom {{ id() }} v knižnici neexistuje.</p>
  <a matButton routerLink="/admin">Späť na správu kníh</a>
}
